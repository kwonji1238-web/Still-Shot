<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- 주소창 색: 아래 값은 canvas 토큰 값이고, 화면이 뜬 뒤에는 src/theme.js가 현재 토큰 값으로 맞춘다 -->
  <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <title>스틸스팟</title>
  <link rel="icon" href="icon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icon/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="icon/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="description" content="영화·드라마 속 촬영지를 지도에서 찾고, 근처 관광지·식당·카페까지 코스로 이어 가 볼 수 있는 서비스예요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 영문 워드마크 전용 Michroma. 글자 STILL-SPOT만 받는다. 다른 영문에 쓰려면 text 파라미터를 지운다 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&text=STILL-SPOT&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
  <!-- 직접 고른 테마를 화면이 그려지기 전에 적용한다(src/theme.js와 같은 키) -->
  <script>try { var t = localStorage.getItem('stillspot-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <!-- 카카오 JavaScript 키. 없으면(404) 지도 없이 목록·상세·코스로 동작한다. -->
  <script src="config.js" onerror="window.STILLSPOT_CONFIG = window.STILLSPOT_CONFIG || {}"></script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div id="map-wrap" aria-hidden="true"><div id="map"></div></div>
  <main id="screen"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
